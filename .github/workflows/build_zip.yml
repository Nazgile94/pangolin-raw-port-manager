name: Build downloadable ZIP

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n pangolin-port
          bash -n lib/pangolin-port-en
          bash -n lib/pangolin-port-de
          bash -n install.sh
          bash -n uninstall.sh

      - name: Determine package version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep -m1 '^VERSION=' pangolin-port | cut -d'"' -f2)"
          fi

          if [[ -z "${VERSION}" ]]; then
            echo "Could not determine package version." >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Package version: ${VERSION}"

      - name: Build ZIP package
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          PACKAGE="pangolin-raw-port-manager-v${VERSION}"

          rm -rf dist
          mkdir -p "dist/${PACKAGE}"

          cp -a \
            pangolin-port \
            lib \
            install.sh \
            uninstall.sh \
            README.md \
            README.de.md \
            CHANGELOG.md \
            SECURITY.md \
            CONTRIBUTING.md \
            LICENSE \
            .gitignore \
            "dist/${PACKAGE}/"

          (
            cd dist
            zip -r "${PACKAGE}.zip" "${PACKAGE}"
          )

          echo
          echo "Created:"
          ls -lh "dist/${PACKAGE}.zip"
          sha256sum "dist/${PACKAGE}.zip"

      - name: Upload ZIP as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/pangolin-raw-port-manager-v${{ steps.version.outputs.version }}.zip
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          ZIP="dist/pangolin-raw-port-manager-v${VERSION}.zip"
          TAG="${GITHUB_REF_NAME}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists. Replacing ZIP asset..."
            gh release upload "${TAG}" "${ZIP}" --clobber
          else
            echo "Creating release ${TAG}..."
            gh release create "${TAG}" "${ZIP}" \
              --title "${TAG}" \
              --generate-notes
          fi
