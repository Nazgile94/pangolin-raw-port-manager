name: Shell syntax

on:
  push:
  pull_request:

jobs:
  bash-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: |
          bash -n pangolin-port
          bash -n lib/pangolin-port-en
          bash -n lib/pangolin-port-de
          bash -n install.sh
          bash -n uninstall.sh
