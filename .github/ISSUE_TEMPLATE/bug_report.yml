name: Bug report
description: Report a reproducible problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste secrets, API keys, license keys, tokens, or unredacted `.env` files.**
  - type: input
    id: version
    attributes:
      label: Script version
      placeholder: "3.1.0"
    validations:
      required: true
  - type: input
    id: pangolin
    attributes:
      label: Pangolin version
      placeholder: "e.g. 1.23.0"
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: textarea
    id: output
    attributes:
      label: Redacted terminal output
      render: shell
